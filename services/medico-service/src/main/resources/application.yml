server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: medico-service
  datasource:
    # Base de datos PROPIA de este servicio. Ningún otro servicio se conecta a ella.
    url: ${DB_URL:jdbc:postgresql://localhost:5434/medicos}
    username: ${DB_USERNAME:consultorio}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/datos-ejemplo

# Llamadas a otros microservicios (siempre por API REST)
clientes:
  timeout-conexion: 2s
  timeout-lectura: 3s
  especialidad-url: ${ESPECIALIDAD_SERVICE_URL:http://localhost:8083}

# Inicio de sesión: clave con la que se verifican (y en paciente-service, se firman) los tokens JWT
seguridad:
  jwt:
    secreto: ${JWT_SECRETO:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMINISTRATIVO
      probes:
        enabled: true
