server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: especialidad-service
  datasource:
    # Base de datos PROPIA de este servicio. Ningún otro servicio se conecta a ella.
    url: ${DB_URL:jdbc:postgresql://localhost:5435/especialidades}
    username: ${DB_USERNAME:consultorio}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo crea Flyway; Hibernate solo verifica que coincida
  flyway:
    locations: classpath:db/migration,classpath:db/datos-ejemplo

# Inicio de sesión: clave con la que se verifican (y en paciente-service, se firman) los tokens JWT
seguridad:
  jwt:
    secreto: ${JWT_SECRETO:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMINISTRATIVO
      probes:
        enabled: true
