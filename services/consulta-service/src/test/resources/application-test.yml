# Perfil de pruebas: base H2 en memoria; Ollama apunta a un puerto donde no hay nada escuchando
# (las pruebas nunca usan un modelo real).
spring:
  datasource:
    url: jdbc:h2:mem:consultas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  ai:
    ollama:
      base-url: http://localhost:1
      chat:
        model: modelo-de-prueba:1b

# Clave SOLO para pruebas automáticas (no es un secreto real)
seguridad:
  jwt:
    secreto: clave-de-prueba-para-tests-de-al-menos-32-caracteres
