server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: turno-service
  datasource:
    # Base de datos PROPIA de este servicio. Ningún otro servicio se conecta a ella.
    url: ${DB_URL:jdbc:postgresql://localhost:5436/turnos}
    username: ${DB_USERNAME:consultorio}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

# Reglas del consultorio (se usan para validar los turnos)
consultorio:
  zona-horaria: ${CONSULTORIO_ZONA_HORARIA:America/Argentina/Buenos_Aires}
  apertura: ${CONSULTORIO_APERTURA:08:00}
  cierre: ${CONSULTORIO_CIERRE:20:00}
  dias-atencion: ${CONSULTORIO_DIAS:MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY}

# Llamadas a otros microservicios (siempre por API REST, nunca a sus bases)
clientes:
  timeout-conexion: 2s
  timeout-lectura: 3s
  paciente-url: ${PACIENTE_SERVICE_URL:http://localhost:8081}
  medico-url: ${MEDICO_SERVICE_URL:http://localhost:8082}
  especialidad-url: ${ESPECIALIDAD_SERVICE_URL:http://localhost:8083}

# Inicio de sesión: clave con la que se verifican (y en paciente-service, se firman) los tokens JWT
seguridad:
  jwt:
    secreto: ${JWT_SECRETO:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMINISTRATIVO
      probes:
        enabled: true
